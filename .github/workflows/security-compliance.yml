name: Security and Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1' # Weekly security scan

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: HIPAA Compliance Check
        continue-on-error: true
        run: |
          if [ -f "scripts/hipaa-compliance-check.py" ]; then
            python scripts/hipaa-compliance-check.py || echo "HIPAA compliance check script failed, see above for details."
          else
            echo "🚫 HIPAA compliance check script not found."
          fi

      - name: Secrets Scanning
        run: |
          echo "🔒 Checking for exposed secrets..."
          if grep -r -i "api_key\|password\|secret\|token" . --exclude-dir=.git --exclude-dir=node_modules --exclude="*.md"; then
            echo "⚠️ Potential secrets found in code."
            exit 1
          else
            echo "✅ No obvious secrets detected."
          fi

      - name: Arabic Text Security Check
        continue-on-error: true
        run: |
          if [ -f "scripts/arabic-security-check.py" ]; then
            python scripts/arabic-security-check.py || echo "Arabic text security check script failed, see above for details."
          else
            echo "🚫 Arabic text security check script not found."
          fi
