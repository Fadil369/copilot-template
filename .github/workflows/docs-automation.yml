name: BrainSAIT Docs Automation

on:
  issues:
    types: [opened, closed, labeled]
  pull_request:
    types: [opened, closed, merged]
  push:
    branches: [main]

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitBook CLI and Dependencies
        run: |
          npm install -g gitbook-cli
          if [ -f package.json ]; then
            npm install
          fi
          npm install openai axios dotenv

      - name: Generate Bilingual Documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -f "scripts/generate-docs.js" ]; then
            node scripts/generate-docs.js
          else
            echo "Documentation generation script not found"
            exit 1
          fi

      - name: Check GitBook CLI and Folder Structure
        run: |
          if ! command -v gitbook &> /dev/null; then
            echo "GitBook CLI is not available. Installation failed."
            exit 1
          fi
          if [ ! -d "./docs" ]; then
            echo "Docs folder not found."
            exit 1
          fi
          if [ ! -f "./docs/README.md" ]; then
            echo "Docs folder missing README.md."
            exit 1
          fi
          echo "GitBook CLI and docs folder look good."
          echo "Available GitBook commands:"
          gitbook --help

      - name: Deploy to GitBook
        if: success()
        run: |
          if gitbook build ./docs; then
            echo "GitBook build completed"
          else
            echo "GitBook build failed. See above for command output and available commands."
            echo "If you are using the new GitBook SaaS, CLI build is not supported. Use GitBook's GitHub integration or API instead."
            exit 1
          fi
