# This CodeQL workflow is ready to use for most projects—just commit it to your repository.
#
# You can customize the workflow to change the set of analyzed languages,
# add custom queries, or adjust build logic as needed.
#
# ******** IMPORTANT ********
# The language matrix below is auto-detected. Review it to ensure it matches
# the languages you want CodeQL to analyze.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 22 * * 5'   # Runs every Friday at 22:19 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner choice affects CodeQL analysis speed. See:
    # - https://gh.io/recommended-hardware-resources-for-running-codeql
    # - https://gh.io/supported-runners-and-hardware-resources
    # Consider larger runners for faster analysis.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write     # Needed for all workflows
      packages: read            # Needed for internal/private CodeQL packs
      actions: read             # Needed for private repositories
      contents: read            # Needed for private repositories

    strategy:
      fail-fast: false
      matrix:
        include:
        # Supported CodeQL languages: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, rust, swift
        # Use 'c-cpp' for C or C++ and 'java-kotlin' for Java or Kotlin.
        # For details on customizing languages/build modes, see:
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
        # For compiled languages, you can set 'build-mode' to manual and add your own build steps.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add any setup steps here (e.g., runtime installation) before initializing CodeQL.
    # Example:
    # - name: Setup runtime
    #   uses: actions/setup-example@v1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # Optionally specify custom queries here or in a config file.
        # To combine queries with those in your config file, prefix with "+".
        # See: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # For manual build mode, add your own build commands below.
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'For manual build mode, replace this with your build commands, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

# Basic workflow for CodeQL (default languages)
name: "CodeQL"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write
